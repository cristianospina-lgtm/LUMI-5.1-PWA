<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0756B8">
<meta name="description" content="LUMI 5.1: Gestión territorial integrada en salud.">
<title>LUMI 5.1</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{--blue:#0756B8;--cyan:#13B8F2;--orange:#FF8500;--ink:#12345A;--muted:#60758C;--line:#DCE8F3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#F0F7FF 0%,#FFFFFF 58%,#FFF7ED 100%);color:var(--ink)}
main{width:min(100%,490px);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:26px;padding:30px 28px 28px;text-align:center;box-shadow:0 18px 55px rgba(7,86,184,.12)}
.logo{display:block;width:min(100%,250px);height:auto;max-height:250px;object-fit:contain;margin:0 auto 10px}
h1{margin:0;color:var(--blue);font-size:32px;letter-spacing:-.8px}
.subtitle{margin:9px 0 24px;color:var(--muted);line-height:1.55}
.open{display:block;width:100%;padding:15px 18px;border-radius:14px;background:linear-gradient(100deg,#0756B8,#079DE0);color:#fff;text-decoration:none;font-weight:750;font-size:16px;box-shadow:0 7px 18px rgba(7,86,184,.18)}
.open:hover{filter:brightness(1.06)}
.note{margin:17px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
@media(max-width:420px){main{padding:24px 20px}.logo{width:min(100%,215px);max-height:215px}h1{font-size:29px}}
</style>
</head>
<body>
<main>
<img class="logo" src="./logo-lumi.png" alt="Mascota e identidad visual de LUMI">
<h1>LUMI 5.1</h1>
<p class="subtitle">Gestión territorial integrada en salud</p>
<a class="open" href="https://script.google.com/macros/s/AKfycbxfUMAqVuXjSMEbpO5zbEW5ZQ74oG9RB3yPIls2tMN_a77g0mlkil_3ULfRc1X7cKsiOw/exec" rel="noopener">Ingresar a LUMI</a>
<p class="note">La información, autenticación y los procesos se gestionan en la plataforma oficial de LUMI mediante Google Apps Script.</p>
</main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(error => console.error("Service Worker:", error));
  });
}
</script>
</body>
</html>
