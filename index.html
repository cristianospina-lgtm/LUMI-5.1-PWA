<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123B68">
<meta name="description" content="LUMI 5.1: Gestión territorial integrada en salud.">
<title>LUMI 5.1</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{--navy:#123B68;--mint:#7DE0C1;--ink:#17324F;--muted:#62748A;--line:#DCE6F0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#EEF5FB,#F8FBFF 55%,#E8F7F3);color:var(--ink)}
main{width:min(100%,480px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 28px;text-align:center;box-shadow:0 18px 55px #123B681F}
.mark{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:var(--navy);display:grid;place-items:center}
.cross{position:relative;width:48px;height:48px}
.cross:before,.cross:after{content:"";position:absolute;background:var(--mint);border-radius:5px}
.cross:before{width:48px;height:16px;left:0;top:16px}
.cross:after{width:16px;height:48px;left:16px;top:0}
h1{margin:0;color:var(--navy);font-size:30px;letter-spacing:-.7px}
.subtitle{margin:10px 0 24px;color:var(--muted);line-height:1.55}
.open{display:block;width:100%;padding:15px 18px;border-radius:13px;background:var(--navy);color:white;text-decoration:none;font-weight:700;font-size:16px}
.open:hover{background:#1D4F91}
.note{margin:18px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"><span class="cross"></span></div>
<h1>LUMI 5.1</h1>
<p class="subtitle">Gestión territorial integrada en salud</p>
<a class="open" href="https://script.google.com/macros/s/AKfycbxfUMAqVuXjSMEbpO5zbEW5ZQ74oG9RB3yPIls2tMN_a77g0mlkil_3ULfRc1X7cKsiOw/exec" rel="noopener">Ingresar a LUMI</a>
<p class="note">La información, autenticación y los procesos se gestionan en la plataforma oficial de LUMI mediante Google Apps Script.</p>
</main>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(error => console.error("Service Worker:", error));
  });
}
</script>
</body>
</html>
