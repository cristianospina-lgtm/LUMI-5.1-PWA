<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0756B8">
<meta name="description" content="LUMI 5.1: Gestión territorial integrada en salud.">
<title>LUMI 5.1</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{--blue:#0756B8;--cyan:#13B8F2;--orange:#FF8500;--ink:#12345A;--muted:#60758C;--line:#DCE8F3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#F0F7FF 0%,#FFFFFF 58%,#FFF7ED 100%);color:var(--ink)}
main{width:min(100%,490px);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:26px;padding:30px 28px 28px;text-align:center;box-shadow:0 18px 55px rgba(7,86,184,.12)}
.logo{display:block;width:min(100%,250px);height:auto;max-height:250px;object-fit:contain;margin:0 auto 10px}
h1{margin:0;color:var(--blue);font-size:32px;letter-spacing:-.8px}
.subtitle{margin:9px 0 22px;color:var(--muted);line-height:1.55}
.action{display:block;width:100%;padding:15px 18px;border:0;border-radius:14px;color:#fff;text-decoration:none;font-weight:750;font-size:16px;cursor:pointer;font-family:inherit}
.enter{background:linear-gradient(100deg,#0756B8,#079DE0);box-shadow:0 7px 18px rgba(7,86,184,.18)}
.install{margin-top:12px;background:linear-gradient(100deg,#F28A00,#FFB21A);color:#172B45;box-shadow:0 7px 18px rgba(242,138,0,.16)}
.action:hover{filter:brightness(1.05)}
.help{display:none;margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#F5FAFF;color:#38516D;text-align:left;font-size:13px;line-height:1.55}
.help.show{display:block}
.note{margin:17px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
</style>
</head>
<body>
<main>
<img class="logo" src="./logo-lumi.png" alt="Mascota de LUMI">
<h1>LUMI 5.1</h1>
<p class="subtitle">Gestión territorial integrada en salud</p>

<a class="action enter" href="https://script.google.com/macros/s/AKfycbxfUMAqVuXjSMEbpO5zbEW5ZQ74oG9RB3yPIls2tMN_a77g0mlkil_3ULfRc1X7cKsiOw/exec" rel="noopener">Ingresar a LUMI</a>
<button class="action install" id="installButton" type="button">⬇ Instalar LUMI 5.1</button>

<div class="help" id="installHelp" role="status" aria-live="polite"></div>
<p class="note" id="statusNote">La información, autenticación y los procesos se gestionan en la plataforma oficial de LUMI mediante Google Apps Script.</p>
</main>

<script>
(() => {
  let deferredInstallPrompt = null;
  const installButton = document.getElementById("installButton");
  const installHelp = document.getElementById("installHelp");
  const statusNote = document.getElementById("statusNote");

  function showHelp(message) {
    installHelp.textContent = message;
    installHelp.classList.add("show");
  }

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches ||
           window.matchMedia("(display-mode: fullscreen)").matches ||
           window.navigator.standalone === true;
  }

  // El botón permanece visible incluso si Chrome aún no emite beforeinstallprompt.
  function refreshInstalledState() {
    if (isStandalone()) {
      installButton.textContent = "LUMI 5.1 instalada";
      statusNote.textContent = "Estás utilizando LUMI 5.1 desde la aplicación instalada.";
    }
  }

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    installButton.textContent = "⬇ Instalar LUMI 5.1";
  });

  installButton.addEventListener("click", async () => {
    if (isStandalone()) {
      showHelp("LUMI 5.1 ya está abierta como aplicación instalada en este dispositivo.");
      return;
    }

    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const result = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;

      if (result && result.outcome === "accepted") {
        showHelp("Aceptaste la instalación. Espera a que Android termine de agregar LUMI a tu pantalla de inicio.");
      } else {
        showHelp("La instalación fue cancelada. Puedes volver a intentarlo cuando quieras.");
      }
      return;
    }

    const ua = navigator.userAgent || "";
    const isIOS = /iphone|ipad|ipod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isAndroid = /android/i.test(ua);

    if (isIOS) {
      showHelp("En iPhone o iPad: abre esta página en Safari, pulsa Compartir y selecciona “Agregar a pantalla de inicio”.");
    } else if (isAndroid) {
      showHelp("Chrome aún no habilitó el cuadro automático. Pulsa ⋮ en Chrome y busca “Instalar aplicación” o “Agregar a pantalla principal”. Si no aparece, comprueba que abriste esta dirección en Chrome y vuelve a intentarlo más tarde.");
    } else {
      showHelp("En Chrome o Edge, busca el icono de instalación en la barra de direcciones o abre el menú del navegador y selecciona “Instalar página como aplicación”.");
    }
  });

  window.addEventListener("appinstalled", () => {
    deferredInstallPrompt = null;
    refreshInstalledState();
    showHelp("LUMI 5.1 se instaló correctamente.");
  });

  window.addEventListener("load", async () => {
    refreshInstalledState();
    if ("serviceWorker" in navigator) {
      try {
        const registration = await navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" });
        registration.update().catch(() => {});
      } catch (error) {
        console.error("No se pudo actualizar el Service Worker de LUMI:", error);
      }
    }
  });
})();
</script>
</body>
</html>
