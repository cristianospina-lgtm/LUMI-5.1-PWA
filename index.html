<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0756B8">
<meta name="description" content="LUMI 5.1: Gestión territorial integrada en salud.">
<title>LUMI 5.1</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
:root{--blue:#0756B8;--cyan:#13B8F2;--orange:#FF8500;--ink:#12345A;--muted:#60758C;--line:#DCE8F3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#F0F7FF 0%,#FFFFFF 58%,#FFF7ED 100%);color:var(--ink)}
main{width:min(100%,490px);background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:26px;padding:30px 28px 28px;text-align:center;box-shadow:0 18px 55px rgba(7,86,184,.12)}
.logo{display:block;width:min(100%,250px);height:auto;max-height:250px;object-fit:contain;margin:0 auto 10px}
h1{margin:0;color:var(--blue);font-size:32px;letter-spacing:-.8px}
.subtitle{margin:9px 0 22px;color:var(--muted);line-height:1.55}
.action{display:block;width:100%;padding:15px 18px;border:0;border-radius:14px;background:linear-gradient(100deg,#0756B8,#079DE0);color:#fff;text-decoration:none;font-weight:750;font-size:16px;box-shadow:0 7px 18px rgba(7,86,184,.18);cursor:pointer;font-family:inherit}
.action:hover{filter:brightness(1.06)}
.install{margin-top:11px;background:linear-gradient(100deg,#F28A00,#FFB21A);color:#172B45}
.install[hidden]{display:none}
.note{margin:17px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
.help{display:none;margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#F5FAFF;color:#38516D;text-align:left;font-size:13px;line-height:1.55}
.help.show{display:block}
@media(max-width:420px){main{padding:24px 20px}.logo{width:min(100%,215px);max-height:215px}h1{font-size:29px}}
</style>
</head>
<body>
<main>
<img class="logo" src="./logo-lumi.png" alt="Mascota de LUMI">
<h1>LUMI 5.1</h1>
<p class="subtitle">Gestión territorial integrada en salud</p>

<a class="action" href="https://script.google.com/macros/s/AKfycbxfUMAqVuXjSMEbpO5zbEW5ZQ74oG9RB3yPIls2tMN_a77g0mlkil_3ULfRc1X7cKsiOw/exec" rel="noopener">Ingresar a LUMI</a>
<button class="action install" id="installButton" type="button">Instalar LUMI 5.1</button>

<div class="help" id="installHelp" role="status" aria-live="polite"></div>
<p class="note" id="statusNote">Accede a la plataforma oficial de LUMI mediante Google Apps Script.</p>
</main>

<script>
let deferredInstallPrompt = null;
const installButton = document.getElementById("installButton");
const installHelp = document.getElementById("installHelp");
const statusNote = document.getElementById("statusNote");

function showInstallHelp(message) {
  installHelp.textContent = message;
  installHelp.classList.add("show");
}

function isAppInstalled() {
  return window.matchMedia("(display-mode: standalone)").matches ||
         window.matchMedia("(display-mode: fullscreen)").matches ||
         window.navigator.standalone === true;
}

function updateInstallState() {
  if (isAppInstalled()) {
    installButton.hidden = true;
    installHelp.classList.remove("show");
    statusNote.textContent = "LUMI 5.1 está instalada en este dispositivo.";
  }
}

window.addEventListener("beforeinstallprompt", (event) => {
  // Evita que Chrome muestre el aviso automáticamente y permite
  // iniciar la instalación cuando el usuario pulsa el botón.
  event.preventDefault();
  deferredInstallPrompt = event;
  installButton.hidden = false;
  installButton.textContent = "Instalar LUMI 5.1";
});

installButton.addEventListener("click", async () => {
  if (isAppInstalled()) {
    updateInstallState();
    return;
  }

  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;

    if (choice && choice.outcome === "accepted") {
      showInstallHelp("Solicitud de instalación aceptada. Busca LUMI 5.1 en la pantalla de inicio.");
    } else {
      showInstallHelp("La instalación se canceló. Puedes intentarlo nuevamente desde este botón o desde el menú de Chrome.");
    }
    return;
  }

  const ua = navigator.userAgent || "";
  const isIOS = /iphone|ipad|ipod/i.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);

  if (isIOS) {
    showInstallHelp("Para instalar en iPhone o iPad: abre esta página en Safari, pulsa Compartir y selecciona “Agregar a pantalla de inicio”.");
  } else if (isAndroid) {
    showInstallHelp("Chrome todavía no ofrece el aviso automático. Abre el menú ⋮ de Chrome y selecciona “Instalar aplicación” o “Agregar a pantalla principal”. Si no aparece, verifica que estés usando Chrome y que la página termine de cargar.");
  } else {
    showInstallHelp("La instalación no está disponible en este momento. En Chrome o Edge, revisa el icono de instalación de la barra de direcciones o el menú del navegador.");
  }
});

window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  updateInstallState();
  showInstallHelp("LUMI 5.1 se instaló correctamente.");
});

window.addEventListener("load", () => {
  updateInstallState();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.info("LUMI PWA: Service Worker activo"))
      .catch(error => console.error("LUMI PWA: error de Service Worker", error));
  }
});

window.matchMedia("(display-mode: standalone)").addEventListener?.("change", updateInstallState);
</script>
</body>
</html>
